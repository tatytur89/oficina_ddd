<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acompanhamento da OS #<span th:text="${id}"></span></title>
    <style>
        :root {
            --cor-fundo: #f4f6f8;
            --cor-cartao: #ffffff;
            --cor-texto: #1f2933;
            --cor-texto-suave: #616e7c;
            --cor-borda: #e4e7eb;
            --cor-primaria: #2f6feb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }
        .cartao {
            background: var(--cor-cartao);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 560px;
            width: 100%;
            padding: 28px 32px;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 4px 0;
        }
        .subtitulo {
            color: var(--cor-texto-suave);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
            margin-bottom: 20px;
        }
        .badge-RECEBIDA { background: #6b7280; }
        .badge-EM_DIAGNOSTICO { background: #d97706; }
        .badge-AGUARDANDO_APROVACAO { background: #dc2626; }
        .badge-EM_EXECUCAO { background: #2563eb; }
        .badge-FINALIZADA { background: #059669; }
        .badge-ENTREGUE { background: #16a34a; }
        .linha {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--cor-borda);
            font-size: 0.92rem;
        }
        .linha span:first-child { color: var(--cor-texto-suave); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 0.88rem;
        }
        th, td {
            text-align: left;
            padding: 6px 4px;
            border-bottom: 1px solid var(--cor-borda);
        }
        h2 {
            font-size: 1rem;
            margin-top: 24px;
            margin-bottom: 4px;
        }
        .valor-total {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 16px;
        }
        .acao {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--cor-borda);
        }
        button {
            background: var(--cor-primaria);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
        button:hover { opacity: 0.9; }
        .aviso {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--cor-borda);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.88rem;
            color: var(--cor-texto-suave);
            margin-bottom: 4px;
        }
        .avaliacao-registrada {
            font-size: 0.95rem;
        }
        .estrelas {
            color: #d97706;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="cartao">
        <h1>Ordem de Serviço #<span th:text="${id}"></span></h1>
        <div class="subtitulo">Acompanhamento do atendimento da sua oficina</div>

        <span class="badge" th:classappend="'badge-' + ${status}" th:text="${statusDescricao}"></span>

        <div class="aviso" th:if="${status == 'FINALIZADA'}">
            Serviço concluído! Seu veículo está pronto para retirada na oficina.
        </div>

        <div class="linha"><span>Aberta em</span><span th:text="${#temporals.format(dataAbertura, 'dd/MM/yyyy ''às'' HH:mm')}"></span></div>
        <div class="linha" th:if="${dataPrevistaEntrega} != null"><span>Previsão de entrega</span><span th:text="${#temporals.format(dataPrevistaEntrega, 'dd/MM/yyyy ''às'' HH:mm')}"></span></div>
        <div class="linha" th:if="${dataConclusao} != null"><span>Concluída em</span><span th:text="${#temporals.format(dataConclusao, 'dd/MM/yyyy ''às'' HH:mm')}"></span></div>
        <div class="linha" th:if="${observacoes} != null"><span>Observações</span><span th:text="${observacoes}"></span></div>

        <h2 th:if="${not #lists.isEmpty(servicos)}">Serviços</h2>
        <table th:if="${not #lists.isEmpty(servicos)}">
            <tr><th>Serviço</th><th>Qtd.</th><th>Valor</th></tr>
            <tr th:each="s : ${servicos}">
                <td th:text="${s.nomeServico}"></td>
                <td th:text="${s.quantidade}"></td>
                <td th:text="${s.valorTotal}"></td>
            </tr>
        </table>

        <h2 th:if="${not #lists.isEmpty(pecas)}">Peças</h2>
        <table th:if="${not #lists.isEmpty(pecas)}">
            <tr><th>Peça</th><th>Qtd.</th><th>Valor</th></tr>
            <tr th:each="p : ${pecas}">
                <td th:text="${p.nomePeca}"></td>
                <td th:text="${p.quantidade}"></td>
                <td th:text="${p.valorTotal}"></td>
            </tr>
        </table>

        <div class="valor-total">Total: R$ <span th:text="${valorTotal}"></span></div>

        <div class="acao" th:if="${podeAprovar}">
            <form th:action="@{'/acompanhamento/' + ${id} + '/aprovar'}" method="post">
                <input type="hidden" name="chave" th:value="${chave}"/>
                <button type="submit">Aprovar orçamento</button>
            </form>
        </div>

        <div class="acao" th:if="${podeAvaliar}">
            <h2>Avalie o serviço</h2>
            <form th:action="@{'/acompanhamento/' + ${id} + '/avaliar'}" method="post">
                <input type="hidden" name="chave" th:value="${chave}"/>
                <label for="nota">Nota</label>
                <select id="nota" name="nota">
                    <option value="5">5 - Excelente</option>
                    <option value="4">4 - Bom</option>
                    <option value="3">3 - Regular</option>
                    <option value="2">2 - Ruim</option>
                    <option value="1">1 - Péssimo</option>
                </select>
                <label for="comentario">Comentário (opcional)</label>
                <textarea id="comentario" name="comentario" rows="3"></textarea>
                <button type="submit">Enviar avaliação</button>
            </form>
        </div>

        <div class="acao avaliacao-registrada" th:if="${notaAvaliacao} != null">
            <h2>Sua avaliação</h2>
            <div class="estrelas" th:text="${'★'.repeat(notaAvaliacao) + '☆'.repeat(5 - notaAvaliacao)}"></div>
            <p th:if="${comentarioAvaliacao} != null" th:text="${comentarioAvaliacao}"></p>
        </div>
    </div>
</body>
</html>
