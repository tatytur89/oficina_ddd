<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acompanhamento indisponível</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .cartao {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            padding: 28px 32px;
            text-align: center;
        }
        h1 { font-size: 1.2rem; margin-bottom: 8px; }
        p { color: #616e7c; }
    </style>
</head>
<body>
    <div class="cartao">
        <h1>Não foi possível acessar essa Ordem de Serviço</h1>
        <p th:text="${erro}"></p>
    </div>
</body>
</html>
