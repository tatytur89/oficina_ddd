# Desenvolvimento na máquina; o perfil docker troca apenas o host padrão.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${app.database.host:localhost}:5432/oficina_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oficina_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.admin.default-user=${ADMIN_USER:admin}
app.admin.default-password=${ADMIN_PASSWORD:admin123}
api.security.token.secret=${JWT_SECRET:local-development-jwt-secret-at-least-32-bytes}
