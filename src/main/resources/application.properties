spring.application.name=oficina-ddd
spring.profiles.default=local
spring.profiles.group.docker=local

server.port=8080

# Commit que gerou a imagem (injetado pelo pipeline de CD)
app.build.commit=${APP_COMMIT_SHA:local}

# Driver compartilhado pelos ambientes de execução.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.paths-to-scan=/api/v1
springdoc.show-actuator=false

logging.level.root=INFO
