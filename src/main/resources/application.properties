spring.application.name=oficina-ddd
spring.profiles.default=local
spring.profiles.group.docker=local

server.port=8080

# Commit que gerou a imagem (injetado pelo pipeline de CD)
app.build.commit=${APP_COMMIT_SHA:local}

# Driver compartilhado pelos ambientes de execução.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.paths-to-scan=/api/v1
springdoc.show-actuator=false

logging.level.root=INFO

# SMTP desabilitado por padrão; habilitação exige senha externa válida.
app.notifications.email.enabled=${APP_NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.email.from=${SMTP_FROM:projetofiapx@gmail.com}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.protocol=${SMTP_PROTOCOL:smtps}
spring.mail.username=${SMTP_USERNAME:projetofiapx@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
# SMTP é de melhor esforço; healthchecks não autenticam em provedores externos.
management.health.mail.enabled=false
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.auth.mechanisms=LOGIN
spring.mail.properties.mail.smtps.ssl.enable=${SMTP_SSL_ENABLED:true}
spring.mail.properties.mail.smtps.ssl.checkserveridentity=true
spring.mail.properties.mail.smtps.connectiontimeout=5000
spring.mail.properties.mail.smtps.timeout=5000
spring.mail.properties.mail.smtps.writetimeout=5000
# Usado apenas quando SMTP_PROTOCOL é explicitamente alterado, como nos testes locais.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
