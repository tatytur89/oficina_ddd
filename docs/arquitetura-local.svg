<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura local da Oficina</title>
  <desc id="desc">Aplicação hexagonal, e-mail após commit, cluster kind com dois nós, Terraform em estados independentes e fluxo configurado de CI Linux.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#55708c"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.title{font-size:30px;font-weight:700}.section{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:16px}.note{font-size:15px;fill:#425b72}.panel{fill:#f3f7fc;stroke:#c4d3e2;stroke-width:2}.box{fill:white;stroke:#9bb4cc;stroke-width:2}.blue{fill:#e1efff;stroke:#6c9bce;stroke-width:2}.orange{fill:#fff0db;stroke:#d5a45e;stroke-width:2}.green{fill:#e4f5ef;stroke:#74ad97;stroke-width:2}.link{fill:none;stroke:#55708c;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1600" height="1240" fill="#fff"/>
  <text x="40" y="48" class="title">Oficina — arquitetura local</text>
  <text x="40" y="77" class="note">Separação hexagonal • Kubernetes local • infraestrutura com estados independentes</text>

  <rect x="35" y="105" width="1530" height="290" rx="16" class="panel"/>
  <text x="60" y="138" class="section">Aplicação e comunicação externa</text>
  <rect x="60" y="165" width="240" height="85" rx="10" class="box"/>
  <text x="80" y="196" class="label">Entrada HTTP / REST</text><text x="80" y="224" class="small">Cliente e equipe administrativa</text>
  <path d="M300 207H335" class="link"/>
  <rect x="335" y="165" width="260" height="85" rx="10" class="blue"/>
  <text x="355" y="196" class="label">Portas de entrada</text><text x="355" y="224" class="small">Casos de uso / transações</text>
  <path d="M595 207H630" class="link"/>
  <rect x="630" y="165" width="255" height="85" rx="10" class="blue"/>
  <text x="650" y="196" class="label">Domínio</text><text x="650" y="224" class="small">OS, orçamento e transições</text>
  <path d="M465 250V292H615" class="link"/>
  <rect x="615" y="267" width="270" height="85" rx="10" class="box"/>
  <text x="635" y="299" class="label">Portas de saída</text><text x="635" y="327" class="small">JPA / evento de notificação</text>
  <path d="M885 309H935" class="link"/>
  <rect x="935" y="267" width="275" height="85" rx="10" class="orange"/>
  <text x="955" y="299" class="label">Listener AFTER_COMMIT</text><text x="955" y="327" class="small">Adaptador SMTP / HTML + texto</text>
  <path d="M1210 309H1250" class="link"/>
  <rect x="1250" y="267" width="280" height="85" rx="10" class="orange"/>
  <text x="1270" y="299" class="label">Gmail → cliente da OS</text><text x="1270" y="327" class="small">SMTPS 465 / AUTH LOGIN</text>
  <text x="940" y="187" class="small">Somente após commit; replay não reenvia.</text>
  <text x="940" y="215" class="note">Falha não desfaz a OS; sem outbox ou retry automático.</text>
  <text x="940" y="240" class="note">Credencial externa, Secret opcional e fora do Git.</text>
  <text x="60" y="377" class="note">O domínio e as portas não dependem do transporte SMTP ou da persistência JPA.</text>

  <rect x="35" y="420" width="1530" height="435" rx="16" class="panel"/>
  <text x="60" y="454" class="section">Kubernetes local — kind / 1 control-plane + 1 worker</text>
  <rect x="60" y="478" width="380" height="185" rx="12" class="box"/>
  <text x="80" y="510" class="label">Control-plane / ingress-ready</text>
  <rect x="80" y="530" width="340" height="66" rx="9" class="blue"/>
  <text x="100" y="557" class="label">Traefik</text><text x="100" y="583" class="small">hostPort 80 / 443</text>
  <text x="80" y="627" class="small">127.0.0.1:8090 / Host oficina.local</text>
  <path d="M440 563H480" class="link"/>
  <rect x="480" y="515" width="320" height="85" rx="10" class="blue"/>
  <text x="500" y="547" class="label">Ingress → Service API:80</text><text x="500" y="575" class="small">Deployment API / perfil lab</text>
  <text x="480" y="630" class="note">Pods alocados pelo scheduler entre os nós;</text>
  <text x="480" y="653" class="note">o worker fornece capacidade de execução.</text>
  <rect x="850" y="478" width="305" height="80" rx="10" class="green"/>
  <text x="870" y="510" class="label">Metrics Server</text><text x="870" y="538" class="small">Métricas reais de CPU dos Pods</text>
  <path d="M1000 558V585" class="link"/>
  <rect x="850" y="585" width="305" height="78" rx="10" class="green"/>
  <text x="870" y="617" class="label">HPA / CPU alvo 70%</text><text x="870" y="645" class="small">Mínimo 2 / máximo 5 réplicas</text>
  <path d="M850 624H815V575H800" class="link"/>
  <rect x="1200" y="493" width="330" height="132" rx="10" class="orange"/>
  <text x="1220" y="526" class="label">Secret SMTP opcional</text>
  <text x="1220" y="555" class="small">Habilitação explícita / runtime</text>
  <text x="1220" y="583" class="small">Ausente: notificações desligadas</text>
  <text x="1220" y="608" class="note">SMTP não participa do healthcheck.</text>
  <path d="M640 600V711" class="link"/>
  <rect x="480" y="711" width="320" height="95" rx="10" class="blue"/>
  <text x="500" y="744" class="label">Service PostgreSQL:5432</text><text x="500" y="774" class="small">StatefulSet PostgreSQL 18 / 1 réplica</text>
  <path d="M800 758H850" class="link"/>
  <rect x="850" y="711" width="305" height="95" rx="10" class="box"/>
  <text x="870" y="744" class="label">PVC 1 Gi / Retain</text><text x="870" y="774" class="small">Armazenamento local / sem HA</text>
  <rect x="60" y="711" width="350" height="95" rx="10" class="green"/>
  <text x="80" y="744" class="label">Job de migração SQL</text><text x="80" y="774" class="small">Versão + checksum + transação</text>
  <path d="M410 758H480" class="link"/>
  <text x="1200" y="729" class="note">Banco e credenciais persistentes</text><text x="1200" y="754" class="note">separados do ciclo de vida da API.</text>
  <text x="60" y="837" class="note">API usa validação do schema; migrações são executadas antes do deploy. Ingress local sem homologação de TLS público.</text>

  <rect x="35" y="880" width="1530" height="130" rx="16" class="panel"/>
  <text x="60" y="915" class="section">Terraform — raízes e estados independentes</text>
  <text x="65" y="954" class="label">infra/local</text><text x="65" y="983" class="small">kind + kubeconfig dedicado</text>
  <text x="520" y="954" class="label">infra/local/database</text><text x="520" y="983" class="small">PostgreSQL + PVC + Job de migração</text>
  <text x="1090" y="954" class="label">infra/local/addons</text><text x="1090" y="983" class="small">Helm: Traefik + Metrics Server</text>

  <rect x="35" y="1035" width="1530" height="165" rx="16" class="panel"/>
  <text x="60" y="1070" class="section">CI Linux — infra/ci / entrega em runner isolado</text>
  <rect x="60" y="1093" width="170" height="65" rx="9" class="box"/><text x="80" y="1132" class="small">Checkout</text>
  <rect x="260" y="1093" width="180" height="65" rx="9" class="box"/><text x="280" y="1132" class="small">Build + testes</text>
  <rect x="470" y="1093" width="210" height="65" rx="9" class="box"/><text x="490" y="1119" class="small">Construir imagem</text><text x="490" y="1143" class="small">Docker local</text>
  <rect x="710" y="1093" width="220" height="65" rx="9" class="box"/><text x="730" y="1119" class="small">Terraform cluster</text><text x="730" y="1143" class="small">Carregar imagem no kind</text>
  <rect x="960" y="1093" width="210" height="65" rx="9" class="box"/><text x="980" y="1119" class="small">Banco + migração</text><text x="980" y="1143" class="small">Terraform addons</text>
  <rect x="1200" y="1093" width="330" height="65" rx="9" class="blue"/><text x="1220" y="1119" class="small">Aplicar API + HPA + Ingress</text><text x="1220" y="1143" class="small">Reproduzir o laboratório local</text>
  <path d="M230 1126H260M440 1126H470M680 1126H710M930 1126H960M1170 1126H1200" class="link"/>
  <text x="60" y="1184" class="note">O diagrama representa a configuração versionada; executar o workflow gera a evidência de provisionamento e deploy.</text>
</svg>
