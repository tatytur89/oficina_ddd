services:
  oficina-ddd:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8089:8080"
    env_file:
      - path: ${SMTP_ENV_FILE:-k8s/local/mail.env}
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5
