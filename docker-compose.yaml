#docker compose usando meu dockerfile local e subindo um container do postgres
services:
  oficina-ddd:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: "password123"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5
