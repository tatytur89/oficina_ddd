apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina-local
resources:
  - ../base
  - namespace.yaml
  - ingress.yaml
  - hpa.yaml
configMapGenerator:
  - name: oficina-api-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=lab
secretGenerator:
  - name: oficina-api-secret
    envs:
      - secret.env
images:
  - name: oficina-ddd
    newName: oficina-ddd
    newTag: local
patches:
  - path: deployment-patch.yaml
