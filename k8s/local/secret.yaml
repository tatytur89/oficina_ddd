# Valores de desenvolvimento, iguais aos do docker-compose.yaml.
# Use apenas no cluster local; em AWS o Secret vem de k8s/secret.yaml (não versionado).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/oficina_db"
  SPRING_DATASOURCE_USERNAME: "oficina_user"
  SPRING_DATASOURCE_PASSWORD: "password123"
  JWT_SECRET: "local-dev-jwt-secret-com-pelo-menos-32-bytes"
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "admin123"
