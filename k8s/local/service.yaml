apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  labels:
    app.kubernetes.io/name: oficina-api
spec:
  # NodePort mapeado para localhost:8090 em kind-config.yaml (substitui o Ingress/ALB)
  type: NodePort
  selector:
    app.kubernetes.io/name: oficina-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
