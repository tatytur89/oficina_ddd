apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
spec:
  template:
    spec:
      containers:
        - name: oficina-api
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
            - secretRef:
                name: oficina-mail-secret
                optional: true
