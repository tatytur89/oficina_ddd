# Cluster kind de um nó para deploy local.
# O NodePort 30080 do Service oficina-api fica acessível em http://localhost:8090.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: oficina-local
nodes:
  - role: control-plane
    # Mesma versão do EKS (infra/variables.tf). Kubernetes 1.35+ não roda em hosts com cgroup v1.
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8090
        protocol: TCP
