apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina-api
resources:
  - ../base
  - ingress.yaml
  - hpa.yaml
configMapGenerator:
  - name: oficina-api-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=aws
images:
  - name: oficina-ddd
    newName: ghcr.io/tatytur89/oficina_ddd
    newTag: latest
