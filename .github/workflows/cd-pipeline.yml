name: CD Pipeline

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: oficina-api

jobs:
  deploy:
    name: Publish image and deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_COMMIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml |
            kubectl apply -f -

      - name: Verify Kubernetes application secret exists
        run: kubectl get secret oficina-api-secret --namespace "$NAMESPACE"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply --namespace "$NAMESPACE" \
            -f k8s/configmap.yaml \
            -f k8s/service.yaml \
            -f k8s/ingress.yaml \
            -f k8s/hpa.yaml

      - name: Apply Deployment with tested image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl set image --local=true -f k8s/deployment.yaml \
            oficina-api="$IMAGE" \
            -o yaml |
            kubectl apply --namespace "$NAMESPACE" -f -
          kubectl rollout status deployment/oficina-api \
            --namespace "$NAMESPACE" \
            --timeout=180s
