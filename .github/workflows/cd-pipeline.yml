name: Deploy AWS manual

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: oficina-api

jobs:
  deploy:
    name: Publish image and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml |
            kubectl apply -f -

      - name: Verify Kubernetes application secret exists
        run: kubectl get secret oficina-api-secret --namespace "$NAMESPACE"

      - name: Apply AWS manifests with tested image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          kubectl set image --local=true -f k8s/base/deployment.yaml \
            oficina-api="$IMAGE" \
            -o yaml > k8s/aws/deployment-image-patch.yaml
          cat >> k8s/aws/kustomization.yaml <<'PATCH'
          patches:
            - path: deployment-image-patch.yaml
          PATCH
          kubectl apply --namespace "$NAMESPACE" -k k8s/aws
          kubectl rollout status deployment/oficina-api \
            --namespace "$NAMESPACE" \
            --timeout=180s
